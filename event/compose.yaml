services:
  db:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_DB: policy_review
      POSTGRES_USER: policy
      POSTGRES_PASSWORD: policy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policy -d policy_review"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://policy:policy@db:5432/policy_review
      SESSION_COOKIE_NAME: policy_session
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost
      BOOTSTRAP_DEMO_DATA: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - file-data:/app/storage

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db-data:
  file-data:
