services:
  db:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_DB: policy_review
      POSTGRES_USER: policy
      POSTGRES_PASSWORD: policy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policy -d policy_review"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://policy:policy@db:5432/policy_review
      SESSION_COOKIE_NAME: policy_session
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost
      BOOTSTRAP_DEMO_DATA: "true"
      FILE_STORAGE_ROOT: /app/storage
      RETRIEVAL_TOP_K: "20"
      RRF_K: "60"
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-glm-4.7}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_THINKING_ENABLED: ${LLM_THINKING_ENABLED:-true}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-8192}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - file-data:/app/storage

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db-data:
  file-data:
